name: Android build environment
description: Shared Buildozer dependencies and cache for APK and AAB builds.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf automake autopoint gettext \
          libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
          libssl-dev build-essential ccache libltdl-dev
    - name: Install pinned Buildozer toolchain
      shell: bash
      run: python -m pip install -r requirements-build.txt
    - name: Constrain both p4a dependency resolution and installation
      shell: bash
      run: echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/constraints-android.txt" >> "$GITHUB_ENV"
    - name: Restore Buildozer cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.buildozer
          ~/.android
          .buildozer
        key: purenote-android-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements-build.txt', 'constraints-android.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          purenote-android-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements-build.txt', 'constraints-android.txt') }}-
          purenote-android-v4-${{ runner.os }}-
          buildozer-v3-
    - name: Recreate disposable p4a installer environments
      shell: bash
      run: |
        python - <<'PY'
        import shutil
        from pathlib import Path

        # Re-running venv over a cached, upgraded pip can leave mixed pip files.
        # Keep compiled recipes; only discard the pure-Python installer venv.
        for environment in Path('.buildozer/android/platform').glob('build-*/build/venv'):
            shutil.rmtree(environment)
        PY
    - name: Use a fresh pip environment for each ABI
      shell: bash
      run: |
        python - <<'PY'
        import configparser
        import os
        import subprocess
        from pathlib import Path

        config = configparser.ConfigParser(interpolation=None)
        config.read('buildozer.spec')
        commit = config['app']['p4a.commit']
        source = Path('.buildozer/android/platform/python-for-android').resolve()
        if not (source / '.git').is_dir():
            source.parent.mkdir(parents=True, exist_ok=True)
            subprocess.run(['git', 'clone', '--no-checkout',
                            'https://github.com/kivy/python-for-android.git', str(source)], check=True)
        if subprocess.run(['git', '-C', str(source), 'cat-file', '-e', commit + '^{commit}'],
                          capture_output=True).returncode:
            subprocess.run(['git', '-C', str(source), 'fetch', 'origin', commit], check=True)
        subprocess.run(['git', '-C', str(source), 'reset', '--hard', commit], check=True)
        build = source / 'pythonforandroid/build.py'
        before = "shprint(host_python, '-m', 'venv', 'venv')"
        after = "shprint(host_python, '-m', 'venv', '--clear', 'venv')"
        text = build.read_text()
        if text.count(before) != 1:
            raise RuntimeError('The pinned p4a venv code changed; review the workaround')
        build.write_text(text.replace(before, after))
        with open(os.environ['GITHUB_ENV'], 'a') as environment:
            environment.write(f'APP_P4A_SOURCE_DIR={source}\n')
        PY
