name: Build PureNote APK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  build-android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-build
      - name: Restore optional persistent debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Build debug APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Verify APK signature and permissions
        run: python tests/verify_apk.py bin/*.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: purenote-debug-apk
          path: bin/*.apk
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purenote-apk-build-log
          path: build.log
      - name: Save build progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            .buildozer
          key: purenote-android-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements-build.txt', 'constraints-android.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
