name: Build PureNote APK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'ARM64 per telefono oppure x86_64 per emulatore'
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - x86_64
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}-${{ inputs.architecture || 'arm64-v8a' }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  build-android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Select emulator architecture
        if: inputs.architecture == 'x86_64'
        run: sed -i 's/^android.archs = .*/android.archs = x86_64/' buildozer.spec
      - uses: ./.github/actions/android-build
      - name: Restore optional persistent debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            key_path="$RUNNER_TEMP/purenote-debug.keystore"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            echo "PURENOTE_DEBUG_KEYSTORE=$key_path" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        shell: bash
        run: buildozer -v android debug
      - name: Sign APK with persistent debug identity
        if: env.PURENOTE_DEBUG_KEYSTORE != ''
        run: python tests/sign_apk.py --keystore "$PURENOTE_DEBUG_KEYSTORE" bin/*.apk
      - name: Verify APK signature and permissions
        run: python tests/verify_apk.py bin/*.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: purenote-debug-apk
          path: bin/*.apk
          if-no-files-found: error
      - name: Save build progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            .buildozer
          key: purenote-android-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements-build.txt', 'constraints-android.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/purenote-debug.keystore"
