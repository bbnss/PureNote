name: Test PureNote
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
      - name: Install UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl1 libmtdev1
      - name: Exercise the real Kivy interface
        env:
          KIVY_NO_CONSOLELOG: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          PURENOTE_SCREENSHOTS: ${{ runner.temp }}/purenote-preview
        run: xvfb-run -a python tests/ui_smoke.py
      - name: Check Android density and enlarged text
        env:
          KIVY_NO_CONSOLELOG: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          KIVY_METRICS_DENSITY: '2.625'
          KIVY_METRICS_FONTSCALE: '1.5'
          PURENOTE_SCREENSHOTS: ${{ runner.temp }}/purenote-preview/enlarged-text
        run: xvfb-run -a -s '-screen 0 1440x2560x24' python tests/ui_smoke.py
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purenote-ui-preview
          path: ${{ runner.temp }}/purenote-preview/
