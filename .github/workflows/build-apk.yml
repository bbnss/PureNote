name: Build PureNote APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev build-essential \
            ccache libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer
          pip install "cython==0.29.36"

      # Restore the most recent cache for this spec (SDK/NDK + compiled bundle).
      # A unique save key per run + prefix restore-keys means progress
      # accumulates even across failed builds.
      - name: Restore buildozer cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            buildozer-v3-${{ hashFiles('buildozer.spec') }}-

      - name: Build debug APK
        run: buildozer android debug

      - name: Save buildozer cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: purenote-debug-apk
          path: bin/*.apk
          if-no-files-found: error
