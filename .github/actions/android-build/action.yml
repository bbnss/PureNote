name: Android build environment
description: Shared Buildozer dependencies and cache for APK and AAB builds.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf automake autopoint gettext \
          libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
          libssl-dev build-essential ccache libltdl-dev
    - name: Install pinned Buildozer toolchain
      shell: bash
      run: python -m pip install -r requirements-build.txt
    - name: Restore Buildozer cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.buildozer
          ~/.android
          .buildozer
        key: purenote-android-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements-build.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          purenote-android-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements-build.txt') }}-
          purenote-android-v4-${{ runner.os }}-
          buildozer-v3-
